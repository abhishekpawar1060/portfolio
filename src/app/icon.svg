<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Browser-tab mark: initials on the warm-ink ground, ember accent.
       Colours are hardcoded because a favicon renders outside the page and
       can't read the site's CSS custom properties. Keep in sync with
       --background and --ember (dark theme) in app/globals.css. -->
  <rect width="64" height="64" rx="14" fill="#0f0b08" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#f1903a" stroke-opacity="0.45" stroke-width="3" />
  <text
    x="32"
    y="33"
    fill="#f1903a"
    font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace"
    font-size="27"
    font-weight="700"
    letter-spacing="-1"
    text-anchor="middle"
    dominant-baseline="central"
  >AP</text>
</svg>
